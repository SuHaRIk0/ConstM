<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LawChecker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f0f4f8;
      padding: 40px 0;
    }

    .container {
      max-width: 900px;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 30px;
      color: #1e293b;
    }

    .form-control {
      background-color: #f9fafb;
      border-color: #cbd5e1;
    }

    .btn-primary {
      background-color: #3b82f6;
      border: none;
    }

    .btn-secondary {
      background-color: #64748b;
      border: none;
    }

    .card-result {
      background: #f8fafc;
      padding: 20px;
      border-left: 4px solid #3b82f6;
      border-radius: 10px;
    }

    .history-box {
      max-height: 250px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
    }

    .result-label {
      font-weight: 600;
    }

    .form-section {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="bi bi-shield-check"></i> Перевірка твердження на відповідність Конституції</h1>

    <div class="row">
      <!-- Вхід та кнопки -->
      <div class="col-md-8 form-section">
        <label for="inputText" class="form-label fw-semibold">Введіть твердження:</label>
        <textarea id="inputText" class="form-control mb-3" rows="4" placeholder="Наприклад: Кожен має право на освіту..."></textarea>

        <div class="d-flex justify-content-between align-items-center gap-2">
          <select class="form-select w-auto" id="languageSelect">
            <option selected>Українська</option>
            <option>English</option>
          </select>

          <div class="ms-auto d-flex gap-2">
            <button class="btn btn-primary" onclick="checkStatement()">
              <i class="bi bi-search"></i> Перевірити
            </button>
            <button class="btn btn-secondary" onclick="clearFields()">
              <i class="bi bi-x-circle"></i> Очистити
            </button>
          </div>
        </div>
      </div>

      <!-- Історія -->
      <div class="col-md-4 form-section">
        <label class="fw-semibold">Історія:</label>
        <div class="history-box" id="historyBox">
          <ul id="historyList" class="list-unstyled mb-0 small"></ul>
        </div>
      </div>
    </div>

    <!-- Результат -->
    <div id="result" style="display:none;">
      <hr />
      <div class="card-result">
        <p><span class="result-label">Вердикт:</span> <span id="verdict"></span></p>
        <p><span class="result-label">Стаття:</span> <span id="article"></span></p>
        <p><span class="result-label">Опис:</span><br><span id="description"></span></p>
        <p><span class="result-label">Довіра:</span> <span id="confidence"></span></p>
      </div>
    </div>
  </div>

  <script>
    async function checkStatement() {
      const input = document.getElementById("inputText").value.trim();
      const resultDiv = document.getElementById("result");

      if (!input) {
        alert("Будь ласка, введіть твердження.");
        return;
      }

      resultDiv.style.display = "none";

      try {
        const response = await fetch("http://127.0.0.1:5000/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input })
        });

        if (!response.ok) throw new Error(await response.text());

        const data = await response.json();

        document.getElementById("verdict").textContent = data.verdict;
        document.getElementById("article").textContent = data.article;
        document.getElementById("description").textContent = data.description;
        document.getElementById("confidence").textContent = (data.confidence * 100).toFixed(2) + " %";
        resultDiv.style.display = "block";

        // Додати до історії
        const historyList = document.getElementById("historyList");
        const item = document.createElement("li");
        item.textContent = input;
        historyList.prepend(item);

      } catch (error) {
        resultDiv.style.display = "block";
        document.getElementById("verdict").textContent = "Помилка: " + error.message;
        document.getElementById("article").textContent = "";
        document.getElementById("description").textContent = "";
        document.getElementById("confidence").textContent = "";
      }
    }

    function clearFields() {
      document.getElementById("inputText").value = "";
      document.getElementById("result").style.display = "none";
    }
  </script>
</body>
</html>
