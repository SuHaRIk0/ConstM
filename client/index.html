<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Конституційний аналіз тверджень</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f6f9;
      padding-top: 50px;
    }

    .container {
      max-width: 700px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn-primary {
      width: 100%;
    }

    .result {
      margin-top: 30px;
      display: none;
      animation: fadeIn 0.7s ease-in-out;
    }

    .card-result {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      border-left: 5px solid #0d6efd;
    }

    .result-label {
      font-weight: 600;
      color: #343a40;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="bi bi-shield-check"></i> Перевірка тверджень на відповідність Конституції</h1>
    <div class="mb-3">
      <label for="inputText" class="form-label">Введіть твердження:</label>
      <textarea class="form-control" id="inputText" placeholder="Наприклад: Кожен має право на освіту..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="checkStatement()">
      <i class="bi bi-search"></i> Перевірити
    </button>

    <div class="result" id="result">
      <div class="card-result mt-4">
        <p><span class="result-label">Вердикт:</span> <span id="verdict"></span></p>
        <p><span class="result-label">Стаття:</span> <span id="article"></span></p>
        <p><span class="result-label">Опис:</span><br><span id="description"></span></p>
        <p><span class="result-label">Довіра:</span> <span id="confidence"></span></p>
      </div>
    </div>
  </div>

  <script>
    async function checkStatement() {
      const text = document.getElementById("inputText").value.trim();
      const resultDiv = document.getElementById("result");

      if (!text) {
        alert("Будь ласка, введіть текст.");
        return;
      }

      resultDiv.style.display = "none";

      try {
        const response = await fetch("http://localhost:5000/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        const data = await response.json();

        document.getElementById("verdict").textContent = data.verdict;
        document.getElementById("article").textContent = data.article;
        document.getElementById("description").textContent = data.description;
        document.getElementById("confidence").textContent = (data.confidence * 100).toFixed(2) + " %";

        resultDiv.style.display = "block";

      } catch (err) {
        resultDiv.style.display = "block";
        document.getElementById("verdict").textContent = "Помилка: " + err.message;
        document.getElementById("article").textContent = "";
        document.getElementById("description").textContent = "";
        document.getElementById("confidence").textContent = "";
      }
    }
  </script>
</body>
</html>
